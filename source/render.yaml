services:
  - type: web
    name: university-records-system
    runtime: python
    rootDir: source
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: URS_DB_PATH
        value: /tmp/university_records.db
